# Fly.io Configuration for EdgeAI Blockchain
# Deploy with: fly launch / fly deploy

app = "edgeai-blockchain-node"
primary_region = "sin"  # Singapore - closest to Asia

[build]
  dockerfile = "Dockerfile"

[env]
  RUST_LOG = "info"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 2048  # Increased to 2GB for blockchain operations

[checks]
  [checks.health]
    grace_period = "300s"  # 5 minutes - blockchain needs time to load data from disk
    interval = "30s"
    method = "get"
    path = "/api/status"
    port = 8080
    timeout = "60s"        # Increased timeout for slow responses during startup
    type = "http"

[mounts]
  source = "edgeai_data"
  destination = "/data"
